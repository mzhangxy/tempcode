name: Auto Renew Server Script

on:
  workflow_dispatch:
  #schedule:
  #  - cron: '0 */6 * * *'

jobs:
  run-renew:
    runs-on: ubuntu-latest 

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10' 

      - name: Install System Dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y xvfb unzip p7zip-full

      - name: Download and Unpack NopeCHA Extension
        run: |
          echo "📦 正在下载 NopeCHA Chromium 插件..."
          mkdir -p extensions/nopecha
          wget -O extensions/nopecha.zip https://github.com/NopeCHALLC/nopecha-extension/releases/latest/download/chromium.zip
          # 确保解压到正确的层级
          7z x -y extensions/nopecha.zip -oextensions/nopecha/
          echo "📌 manifest.json 检查:"
          cat extensions/nopecha/manifest.json | grep version || echo "未找到 manifest.json"

      - name: Install and Run Xray
        env:
          V2RAY_CONFIG: ${{ secrets.V2RAY_CONFIG }}
        run: |
          echo "⬇️ 正在下载 Xray-core..."
          wget -q https://github.com/XTLS/Xray-core/releases/latest/download/Xray-linux-64.zip
          unzip -q Xray-linux-64.zip -d xray_bin
          echo "$V2RAY_CONFIG" > xray_bin/config.json
          cd xray_bin
          nohup ./xray run -c config.json > xray.log 2>&1 &
          cd ..
          sleep 5
          curl -x http://127.0.0.1:10808 -I https://www.google.com/generate_204 || true

      - name: Install Python Dependencies
        run: |
          python -m pip install --upgrade pip
          pip install playwright xvfbwrapper requests
          # 安装 Playwright 内置浏览器及其系统依赖
          playwright install chromium
          playwright install-deps chromium

      - name: Run Renew Script
        env:
          RENEW_URL: ${{ secrets.RENEW_URL }}
          TG_TOKEN: ${{ secrets.TG_TOKEN }}
          TG_CHAT_ID: ${{ secrets.TG_CHAT_ID }}
          PROXY: http://127.0.0.1:10808
          NOPECHA_KEY: ${{ secrets.NOPECHA_KEY }}
        run: python main.py 

      - name: Upload Error Screenshots
        uses: actions/upload-artifact@v4
        if: always() 
        with:
          name: debug-screenshots 
          path: |
            ./*.html
            ./*.jpg
          retention-days: 5
